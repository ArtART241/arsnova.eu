services:
  # PostgreSQL Datenbank (Für Prisma ORM)
  postgres:
    image: postgres:16-alpine
    container_name: arsnova-v3-postgres
    restart: always
    environment:
      POSTGRES_USER: arsnova_user
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: arsnova_v3_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arsnova_user -d arsnova_v3_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis (Für tRPC Pub/Sub & WebSockets)
  redis:
    image: redis:7.4-alpine
    container_name: arsnova-v3-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --appendfsync everysec --save 60 1 --loglevel warning
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend + Frontend (Multi-Stage Dockerfile)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arsnova-v3-app
    restart: always
    group_add:
      - '65532'
    ports:
      - '3000:3000'
      - '3001:3001'
      - '3002:3002'
    environment:
      DATABASE_URL: 'postgresql://arsnova_user:secretpassword@postgres:5432/arsnova_v3_dev?schema=public'
      REDIS_URL: 'redis://redis:6379'
      PORT: '3000'
      HOST: '0.0.0.0'
      WS_PORT: '3001'
      YJS_WS_PORT: '3002'
      NODE_ENV: 'production'
      PUBLIC_FRONTEND_URL: 'http://127.0.0.1:3000'
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: '/usr/bin/chromium'
      NLP_ENABLED: 'false'
      NLP_SOCKET_PATH: /run/spacy/nlp.sock
      NLP_TIMEOUT_MS: '5000'
      NLP_CACHE_TTL_SECONDS: '1800'
      WORD_CLOUD_SEMANTIC_ENABLED: 'false'
      WORD_CLOUD_ENCODER_SOCKET_PATH: /run/wordcloud-encoder/encoder.sock
      WORD_CLOUD_ENCODER_TIMEOUT_MS: '120000'
      WORD_CLOUD_ENCODER_CACHE_TTL_SECONDS: '1800'
      OPEN_WEIGHT_LLM_ENABLED: ${OPEN_WEIGHT_LLM_ENABLED:-false}
      OPEN_WEIGHT_LLM_SOCKET_PATH: /run/open-weight-llm/llm.sock
      OPEN_WEIGHT_LLM_TOKEN: ${OPEN_WEIGHT_LLM_TOKEN:-local-runtime-token-change-me-000000000000}
    volumes:
      - spacy_socket:/run/spacy:ro
      - wordcloud_encoder_socket:/run/wordcloud-encoder:ro
      - open_weight_llm_socket:/run/open-weight-llm:ro
    depends_on:
      open-weight-llm:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/trpc/health.check']
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # Optionaler spaCy-Sidecar (Story 1.14b, umgesetzt). Start: docker compose --profile nlp up -d
  spacy:
    profiles: ['nlp']
    build:
      context: ./docker/spacy
      dockerfile: Dockerfile
    container_name: arsnova-v3-spacy
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: none
    pids_limit: 64
    mem_limit: 1g
    cpus: '1.0'
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    volumes:
      - spacy_socket:/run/spacy
    environment:
      HOME: /tmp
      NLP_SOCKET_PATH: /run/spacy/nlp.sock
    healthcheck:
      test: ['CMD', 'python', '/app/healthcheck.py']
      interval: 15s
      timeout: 3s
      start_period: 90s
      retries: 5

  # Optionaler Word-Cloud-Encoder (Story 1.14c Stufe 1). Start: docker compose --profile encoder up -d
  wordcloud-encoder:
    profiles: ['encoder']
    build:
      context: ./docker/wordcloud-encoder
      dockerfile: Dockerfile
    container_name: arsnova-v3-wordcloud-encoder
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: none
    pids_limit: 64
    mem_limit: 2g
    cpus: '1.0'
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    volumes:
      - wordcloud_encoder_socket:/run/wordcloud-encoder
    environment:
      HOME: /tmp
      WORD_CLOUD_ENCODER_SOCKET_PATH: /run/wordcloud-encoder/encoder.sock
      WORD_CLOUD_ENCODER_MODEL_DIR: /models/e5-small
    healthcheck:
      test: ['CMD', 'python', '/app/healthcheck.py']
      interval: 15s
      timeout: 3s
      start_period: 120s
      retries: 5

  # Same-host-Labor für Story 8.9d. Nicht zusammen mit nlp+encoder auf dem
  # 16-GB-Live-Host starten. Produktion nutzt docker-compose.llm.yml auf einem
  # zweiten privaten Host.
  open-weight-llm:
    profiles: ['llm']
    build:
      context: ./docker/open-weight-llm
      dockerfile: Dockerfile
    image: arsnova-open-weight-llm:llama-b10524
    container_name: arsnova-v3-open-weight-llm
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: none
    pids_limit: 128
    mem_limit: 5g
    cpus: '4.0'
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    volumes:
      - open_weight_llm_socket:/run/open-weight-llm
      - ${OPEN_WEIGHT_LLM_MODEL_DIR:-./models/open-weight-llm}:/models:ro
    environment:
      OPEN_WEIGHT_LLM_TRANSPORT: unix
      OPEN_WEIGHT_LLM_SOCKET_PATH: /run/open-weight-llm/llm.sock
      OPEN_WEIGHT_LLM_TOKEN: ${OPEN_WEIGHT_LLM_TOKEN:-local-runtime-token-change-me-000000000000}
      OPEN_WEIGHT_LLM_THREADS: '4'
    healthcheck:
      test: ['CMD', '/opt/arsnova/healthcheck.sh']
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 5
    stop_grace_period: 10s

  # Explizites HTTP-Labor für einen per npm gestarteten Backendprozess auf dem
  # Docker-Host. Benötigt Docker-Host-Networking und bindet nur an Loopback.
  # Nicht für Produktion verwenden; dort gilt docker-compose.llm.yml.
  open-weight-llm-http:
    profiles: ['llm-http']
    build:
      context: ./docker/open-weight-llm
      dockerfile: Dockerfile
    image: arsnova-open-weight-llm:llama-b10524
    container_name: arsnova-v3-open-weight-llm-http
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: host
    pids_limit: 128
    mem_limit: 5g
    cpus: '4.0'
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    volumes:
      - ${OPEN_WEIGHT_LLM_MODEL_DIR:-./models/open-weight-llm}:/models:ro
    environment:
      OPEN_WEIGHT_LLM_TRANSPORT: http
      OPEN_WEIGHT_LLM_BIND_ADDRESS: 127.0.0.1
      OPEN_WEIGHT_LLM_TOKEN: ${OPEN_WEIGHT_LLM_TOKEN:-local-runtime-token-change-me-000000000000}
      OPEN_WEIGHT_LLM_THREADS: '4'
    healthcheck:
      test: ['CMD', '/opt/arsnova/healthcheck.sh']
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 5
    stop_grace_period: 10s

volumes:
  postgres_data:
  redis_data:
  spacy_socket:
  wordcloud_encoder_socket:
  open_weight_llm_socket:
